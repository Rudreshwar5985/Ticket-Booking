<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Tickets</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <script>
    function deleteConfirmation() {
        return confirm("Are you sure you want to delete this ticket?");
    }
  </script>
</head>

<body>

<div class="container">


  <h2 class="text-center mb-4">Booked Tickets</h2>

  <a href="/" class="btn btn-primary mb-3" >Book New Ticket</a>

  <table class="table table-bordered table-striped table-hover">

    <thead class="table-dark">
    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>DOB</th>
      <th>Gender</th>
      <th>Journey Date</th>
      <th>Source</th>
      <th>Destination</th>
      <th>Train No</th>
      <th>Actions</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="ticket:${tickets}">

      <td th:text="${ticket.name}"></td>
      <td th:text="${ticket.Email}"></td>
      <td th:text="${ticket.Dob}"></td>
      <td th:text="${ticket.Gender}"></td>
      <td th:text="${ticket.doj}"></td>
      <td th:text="${ticket.source}"></td>
      <td th:text="${ticket.destination}"></td>
      <td th:text="${ticket.trainNum}"></td>

      <td>
        <a th:href="@{/edit(id=${ticket.id})}"
           class="btn btn-warning btn-sm">
          Edit
        </a>

        <a th:href="@{/delete(id=${ticket.id})}"
           class="btn btn-danger btn-sm"
           onclick="return deleteConfirmation()">
          Delete
        </a>
      </td>

    </tr>

    </tbody>

  </table>



</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
