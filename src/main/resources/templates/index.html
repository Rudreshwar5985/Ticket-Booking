<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book Ticket</title>


  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container">

  <div class="card shadow-lg">
    <div class="card-header bg-primary text-white">
      <h2 class="text-center">Train Ticket Booking</h2>
    </div>

    <div class="card-body">

      <form action="/save" method="post">

        <div class="row mb-3">
          <label class="col-sm-3 col-form-label">Name</label>
          <div class="col-sm-9">
            <input type="text" name="name" class="form-control" placeholder="Enter Name" required>
          </div>
        </div>

        <div class="row mb-3">
          <label class="col-sm-3 col-form-label">Email</label>
          <div class="col-sm-9">
            <input type="email" name="email" class="form-control" placeholder="Enter Email" required>
          </div>
        </div>

        <div class="row mb-3">
          <label class="col-sm-3 col-form-label">Date of Birth</label>
          <div class="col-sm-9">
            <input type="date" name="dob" class="form-control">
          </div>
        </div>

        <div class="row mb-3">
          <label class="col-sm-3 col-form-label">Gender</label>
          <div class="col-sm-9">
            <select class="form-select" name="gender">
              <option>Male</option>
              <option>Female</option>
              <option>Other</option>
            </select>
          </div>
        </div>

        <div class="row mb-3">
          <label class="col-sm-3 col-form-label">Journey Date</label>
          <div class="col-sm-9">
            <input type="date" name="doj" class="form-control">
          </div>
        </div>

        <div class="row mb-3">
          <label class="col-sm-3 col-form-label">Source</label>
          <div class="col-sm-9">
            <input type="text" name="source" class="form-control">
          </div>
        </div>

        <div class="row mb-3">
          <label class="col-sm-3 col-form-label">Destination</label>
          <div class="col-sm-9">
            <input type="text" name="destination" class="form-control">
          </div>
        </div>

        <div class="row mb-3">
          <label class="col-sm-3 col-form-label">Train Number</label>
          <div class="col-sm-9">
            <input type="text" name="trainNum" class="form-control">
          </div>
        </div>

        <div class="text-center">
          <button class="btn btn-success px-5" type="submit">
            Book Ticket
          </button>
        </div>

      </form>


    </div>
  </div>

</div>

</body>
</html>
